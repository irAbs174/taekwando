{% extends "dashboard/base_admin.html" %}
{% load i18n %}
{% block title %}{% trans "Belt Rank Form" %} | {{ SITE_NAME }}{% endblock %}
{% block admin_content %}
<div class="section-head"><h1 class="section-title">{% trans "Belt Rank" %}</h1></div>
<div class="card"><div class="card-body" >
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "includes/form_fields.html" with form=form %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{% trans "Save" %}</button>
      <a class="btn btn-outline" href="{% url 'belts:admin_type_list' %}">{% trans "Cancel" %}</a>
    </div>
  </form>
</div></div>
{% endblock %}
