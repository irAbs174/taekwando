{% load i18n %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TECHWANDO — 500</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
      font-family: "Vazirmatn", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at 80% 10%, #2b3a52, #0b1524 60%);
      color: #eef2f7; text-align: center;
    }
    .box { max-width: 560px; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 1.5rem; border-radius: 16px;
      background: #c62828; display: grid; place-items: center; font-weight: 800; font-size: 1.4rem;
    }
    h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); margin: 0 0 .75rem; }
    p { color: #aab6c6; line-height: 1.8; margin: 0 0 .6rem; }
    a { display: inline-block; margin-top: 1.5rem; padding: .7rem 1.4rem; border-radius: 8px;
        background: #fff; color: #14243a; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">TW</div>
    <h1>TECHWANDO — {% trans "Server Error" %}</h1>
    <p>{% trans "An unexpected server error occurred. Please try again shortly." %}</p>
    <p lang="ko" dir="ltr">서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</p>
    <a href="/">{% trans "Return to Homepage" %}</a>
  </div>
</body>
</html>
