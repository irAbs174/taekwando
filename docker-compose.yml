# =============================================================================
# TECHWANDO — Production Docker Compose Stack
# Services:
#   - web:    Django 5.2 LTS served by Gunicorn (non-root)
#   - nginx:  TLS termination, static/public media, internal X-Accel-Redirect
#   - backup: Scheduled verified online SQLite backup runner
# =============================================================================
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techwando_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SQLITE_DB_PATH: /app/data/db.sqlite3
      USE_X_ACCEL_REDIRECT: "True"
      X_ACCEL_REDIRECT_PREFIX: "/_private_media"
    volumes:
      - sqlite_data:/app/data
      - static_volume:/app/staticfiles
      - public_media:/app/media
      - private_media:/app/private_media
      - app_logs:/app/logs
      - db_backups:/app/backups
    expose:
      - "8000"
    networks:
      - techwando_net

  nginx:
    image: nginx:1.27-alpine
    container_name: techwando_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/techwando/staticfiles:ro
      - public_media:/var/www/techwando/media:ro
      - private_media:/var/www/techwando/private_media:ro
      - ./deploy/certs:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    networks:
      - techwando_net

  backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techwando_backup
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SQLITE_DB_PATH: /app/data/db.sqlite3
      BACKUP_RETENTION_COUNT: "30"
    volumes:
      - sqlite_data:/app/data:ro
      - private_media:/app/private_media:ro
      - db_backups:/app/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          python manage.py backup_sqlite --output-dir /app/backups --keep "$${BACKUP_RETENTION_COUNT:-30}"
          sleep 86400
        done
    networks:
      - techwando_net

volumes:
  sqlite_data:
  static_volume:
  public_media:
  private_media:
  app_logs:
  nginx_logs:
  db_backups:

networks:
  techwando_net:
    driver: bridge
