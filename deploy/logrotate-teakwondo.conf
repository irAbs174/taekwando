# /etc/logrotate.d/teakwondo
/srv/teakwondo/logs/*.log /var/log/nginx/teakwondo_*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 teakwondo adm
    sharedscripts
    postrotate
        [ -s /run/nginx.pid ] && kill -USR1 $(cat /run/nginx.pid) || true
    endscript
}
