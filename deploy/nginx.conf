# =============================================================================
# TEAKWONDO — Production Nginx Reverse Proxy Configuration
# Features:
#   - HTTP -> HTTPS 301 redirect + ACME Let's Encrypt challenge path
#   - Modern TLS 1.2 / 1.3 + HSTS + security headers
#   - Rate limiting on authentication, contact, and API endpoints
#   - Immutable cached /static/ delivery
#   - Hardened public /media/ delivery (blocks certificates/medals/activities)
#   - `internal` /_private_media/ location for Django X-Accel-Redirect
# =============================================================================

limit_req_zone $binary_remote_addr zone=tw_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=tw_general:10m rate=20r/s;

upstream teakwondo_app {
    server web:8000 fail_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name teakwondo.example.com www.teakwondo.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name teakwondo.example.com www.teakwondo.example.com;
    server_tokens off;

    # TLS certificates (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/teakwondo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teakwondo.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Enforce upload size limit matching Django MAX_UPLOAD_SIZE_MB (default 5MB + overhead)
    client_max_body_size 8M;

    # Security headers (defense-in-depth alongside Django middleware)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/teakwondo_access.log;
    error_log  /var/log/nginx/teakwondo_error.log warn;

    # Collected static files
    location /static/ {
        alias /var/www/teakwondo/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Explicit deny for any sensitive media prefix (never stored in MEDIA_ROOT, blocked in depth)
    location ~* ^/media/(certificates|medals|activities)/ {
        deny all;
        return 403;
    }

    # Public media only (approved member avatars, blog images, product photos, OG images)
    location /media/ {
        alias /var/www/teakwondo/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        # Never execute scripts from media directory
        location ~* \.(php|py|pl|sh|cgi|html|htm|svg|js)$ {
            deny all;
            return 403;
        }
    }

    # PRIVATE MEDIA — strictly `internal`! Reachable ONLY after Django validates
    # session authentication + ownership/moderator RBAC and emits X-Accel-Redirect.
    location /_private_media/ {
        internal;
        alias /var/www/teakwondo/private_media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }

    # Rate-limited authentication & contact submission paths
    location ~ ^/(fa|ja)/(accounts/(login|register|password-reset)|contact)/ {
        limit_req zone=tw_auth burst=8 nodelay;
        proxy_pass http://teakwondo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Application & REST API proxy
    location / {
        limit_req zone=tw_general burst=40 nodelay;
        proxy_pass http://teakwondo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
