# /etc/logrotate.d/techwando
/srv/techwando/logs/*.log /var/log/nginx/techwando_*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 techwando adm
    sharedscripts
    postrotate
        [ -s /run/nginx.pid ] && kill -USR1 $(cat /run/nginx.pid) || true
    endscript
}
